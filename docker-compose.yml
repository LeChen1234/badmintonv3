services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: badminton-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY:?BACKEND_SECRET_KEY is required}
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}'
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-false}
      ENABLE_ML_BACKEND: ${ENABLE_ML_BACKEND:-false}
      POSE_YOLO_MODEL: ${POSE_YOLO_MODEL:-yolov8m-pose.pt}
      POSE_YOLO_IMAGE_SIZE: ${POSE_YOLO_IMAGE_SIZE:-960}
      POSE_BOX_PADDING_RATIO: ${POSE_BOX_PADDING_RATIO:-0.15}
      DATA_DIR: /app/data
      SQLITE_DB_PATH: /app/data/badminton.db
      EXPORT_DIR: /app/data/exports
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/data/backups
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)); assert d['status']=='ready'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: badminton-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  backend_data:
